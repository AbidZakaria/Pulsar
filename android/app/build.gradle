plugins { id 'com.android.application' }

android {
    namespace 'com.abidzakaria.pulsar'
    compileSdk 34
    defaultConfig {
        applicationId 'com.abidzakaria.pulsar'
        minSdk 29
        targetSdk 34
        versionCode 2
        versionName '2.0'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
        coreLibraryDesugaringEnabled true
    }
    signingConfigs {
        release {
            storeFile file(System.getenv('PULSAR_KEYSTORE') ?: 'pulsar.keystore')
            storePassword 'pulsar123'
            keyAlias 'pulsar'
            keyPassword 'pulsar123'
        }
    }
    buildTypes { release { signingConfig signingConfigs.release; minifyEnabled false } }
    packaging { resources { excludes += ['META-INF/*.kotlin_module', 'META-INF/DEPENDENCIES', 'META-INF/LICENSE*', 'META-INF/NOTICE*', 'META-INF/INDEX.LIST'] } }
}

dependencies {
    implementation 'com.github.TeamNewPipe:NewPipeExtractor:v0.26.5'
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.4'
}
